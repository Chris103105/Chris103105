name: Actualizar perfil glitch

on:
  schedule:
    - cron: "0 6 * * *"     # todos los días
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - generar_perfil.py
      - "foto.*"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: |
          pip install pillow fonttools brotli
          npm i --no-save simple-icons @fontsource/space-grotesk

      - name: Generar SVGs
        run: python generar_perfil.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add header.svg profile.svg logos.svg
          git diff --cached --quiet || git commit -m "🔄 actualizar perfil"
          git push
